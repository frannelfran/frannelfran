<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d2e"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a2e"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a0d"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="300" fill="url(#bg)" rx="16"/>

  <!-- CARD 1: Redes Neuronales en Keras -->
  <rect x="16" y="16" width="264" height="268" rx="12" fill="url(#card1)" stroke="#ff6b9d" stroke-width="1" stroke-opacity="0.6"/>
  <!-- top accent bar -->
  <rect x="16" y="16" width="264" height="3" rx="12" fill="#ff6b9d" opacity="0.9"/>
  <!-- icon circle -->
  <circle cx="56" cy="68" r="20" fill="#ff6b9d" fill-opacity="0.12" stroke="#ff6b9d" stroke-width="1" stroke-opacity="0.5"/>
  <text x="56" y="74" text-anchor="middle" font-size="16">🧠</text>
  <!-- title -->
  <text x="86" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Redes-Neuronales</text>
  <text x="86" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">en-Keras</text>
  <!-- divider -->
  <line x1="30" y1="100" x2="266" y2="100" stroke="#ff6b9d" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- description -->
  <text x="30" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Implementación de redes</text>
  <text x="30" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">neuronales desde cero con</text>
  <text x="30" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Keras y TensorFlow.</text>
  <!-- tags -->
  <rect x="30" y="172" width="60" height="20" rx="10" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="60" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#ff6b9d">Python</text>
  <rect x="98" y="172" width="50" height="20" rx="10" fill="#c9b8ff" fill-opacity="0.15" stroke="#c9b8ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="123" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#c9b8ff">Keras</text>
  <rect x="156" y="172" width="70" height="20" rx="10" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="191" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffd700">TensorFlow</text>
  <!-- stats -->
  <text x="30" y="230" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">⭐ Stars</text>
  <text x="30" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">🍴 Forks</text>
  <!-- link button -->
  <rect x="30" y="262" width="230" height="10" rx="5" fill="#ff6b9d" fill-opacity="0.08"/>
  <rect x="30" y="262" width="140" height="10" rx="5" fill="#ff6b9d" fill-opacity="0.25"/>

  <!-- CARD 2: Maquina de Turing -->
  <rect x="298" y="16" width="264" height="268" rx="12" fill="url(#card2)" stroke="#c9b8ff" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="298" y="16" width="264" height="3" rx="12" fill="#c9b8ff" opacity="0.9"/>
  <circle cx="338" cy="68" r="20" fill="#c9b8ff" fill-opacity="0.12" stroke="#c9b8ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="338" y="74" text-anchor="middle" font-size="16">⚙️</text>
  <text x="368" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Maquina-de-Turing</text>
  <text x="368" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b949e">Automata Theory</text>
  <line x1="312" y1="100" x2="548" y2="100" stroke="#c9b8ff" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="312" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Simulación completa de una</text>
  <text x="312" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Máquina de Turing con</text>
  <text x="312" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">múltiples estados y cintas.</text>
  <rect x="312" y="172" width="50" height="20" rx="10" fill="#c9b8ff" fill-opacity="0.15" stroke="#c9b8ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="337" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#c9b8ff">Java</text>
  <rect x="370" y="172" width="70" height="20" rx="10" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="405" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#ff6b9d">Automatas</text>
  <text x="312" y="230" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">⭐ Stars</text>
  <text x="312" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">🍴 Forks</text>
  <rect x="312" y="262" width="230" height="10" rx="5" fill="#c9b8ff" fill-opacity="0.08"/>
  <rect x="312" y="262" width="115" height="10" rx="5" fill="#c9b8ff" fill-opacity="0.25"/>

  <!-- CARD 3: APv -->
  <rect x="580" y="16" width="264" height="268" rx="12" fill="url(#card3)" stroke="#ffd700" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="580" y="16" width="264" height="3" rx="12" fill="#ffd700" opacity="0.9"/>
  <circle cx="620" cy="68" r="20" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="1" stroke-opacity="0.5"/>
  <text x="620" y="74" text-anchor="middle" font-size="16">🚀</text>
  <text x="650" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">APv</text>
  <text x="650" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b949e">Proyecto Universitario</text>
  <line x1="594" y1="100" x2="830" y2="100" stroke="#ffd700" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="594" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">Aplicación desarrollada</text>
  <text x="594" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">como proyecto práctico</text>
  <text x="594" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">de la carrera universitaria.</text>
  <rect x="594" y="172" width="70" height="20" rx="10" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="629" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffd700">TypeScript</text>
  <rect x="672" y="172" width="55" height="20" rx="10" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="699" y="186" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#00e5ff">ULL</text>
  <text x="594" y="230" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">⭐ Stars</text>
  <text x="594" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">🍴 Forks</text>
  <rect x="594" y="262" width="230" height="10" rx="5" fill="#ffd700" fill-opacity="0.08"/>
  <rect x="594" y="262" width="90" height="10" rx="5" fill="#ffd700" fill-opacity="0.25"/>
</svg>