name: Update Stats SVG

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub stats
        id: stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const result = await github.graphql(`
              query {
                user(login: "frannelfran") {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `);

            const calendar = result.user.contributionsCollection.contributionCalendar;
            const total = calendar.totalContributions;

            const days = calendar.weeks.flatMap(w => w.contributionDays);
            let maxStreak = 0;
            let current = 0;
            for (const day of days) {
              if (day.contributionCount > 0) {
                current++;
                maxStreak = Math.max(maxStreak, current);
              } else {
                current = 0;
              }
            }

            core.setOutput('total', total);
            core.setOutput('streak', maxStreak);
            console.log(`Total: ${total}, Max streak: ${maxStreak}`);

      - name: Update logros.svg
        run: |
          TOTAL="${{ steps.stats.outputs.total }}"
          STREAK="${{ steps.stats.outputs.streak }}"

          sed -i "s|<!-- CONTRIBUTIONS -->|${TOTAL}|g" assets/logros.svg
          sed -i "s|<!-- STREAK --> días|${STREAK} días|g" assets/logros.svg

      - name: Commit and push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add assets/logros.svg
          git diff --staged --quiet || git commit -m "chore: update stats in logros.svg"
          git push