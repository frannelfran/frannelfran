name: Actualizar logros y actividad de GitHub

on:
  schedule:
    - cron: "17 5 * * *"   # cada día
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_achievements.py"
      - "scripts/generate_stats.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar sección de logros
        run: python scripts/update_achievements.py
      - name: Regenerar panel de actividad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain README.md assets/actividad.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets/actividad.svg
            git commit -m "chore: actualizar logros de GitHub"
            git push
          fi
